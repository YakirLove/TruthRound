schemaVersion: 1

metadata:
  id: wutong-clinic-gold-ring
  title: 梧桐镇诊所金戒指失踪案
  difficulty: 2
  status: unlocked
  summary: 诊所纠纷 / 金戒指失踪 / 预计短局
  tags:
    - 生活纠纷
    - 小额盗窃
    - 误导嫌疑
    - 短局

briefing:
  incidentSummary: >
    梧桐镇一家小诊所里，医生李教授在给老人患者做理疗前摘下手上的金戒指，
    暂时放在前台托盘里。几分钟后，一名穿运动服的年轻人闯进诊所与他争执，
    争执结束后，托盘还在，戒指却不见了。

  reportText: >
    李教授报案称，他的金戒指是在诊所前台附近短时间内失踪的。
    当时诊所里只有护士兼助理小卢、老人患者周奶奶，以及追进来争执的年轻人赵晨。
    周警官把相关人员请到圆桌，要求每个人说明案发前后的行动。

  reporter:
    name: 李教授
    identity: 梧桐镇小诊所医生，金戒指失主。
    concern: >
      戒指是他多年佩戴的旧物，虽然诊所里当时人不多，但每个人都说自己没拿，
      如果说不清楚，诊所以后也不好继续开门接诊。
    statement: >
      我给周奶奶做理疗前，怕按摩油沾到戒指，就把戒指摘下来放在前台托盘里。
      赵晨后来追进来跟我争，我应付完再回头看，托盘还在，戒指没了。

  involvedParties:
    - characterId: lu
      relationship: 诊所护士兼助理，平时负责前台、接待和理疗准备。
      summonsReason: 案发时一直在前台附近，最熟悉托盘和柜台位置。
    - characterId: zhao
      relationship: 穿运动服的年轻人，曾因家人就诊问题和李教授有过不愉快。
      summonsReason: 案发时从门口追进诊所争执，经过前台附近，有接近托盘的机会。
    - characterId: zhou-granny
      relationship: 老人患者，当天来诊所看膝盖。
      summonsReason: 案发时在诊所内，目睹了李教授摘戒指、小卢嚼口香糖和赵晨争执。

characters:
  - id: officer-zhou
    name: 周警官
    roleType: police
    portrait: null
    personality: 稳重、克制，重视程序和事实。
    publicBackground: 梧桐镇片区民警，负责把相关人员请到圆桌并维持盘问秩序。
    visibleFacts:
      - 接到李教授报案后，到诊所登记现场情况，并把相关人员请来说明。
    privateFacts: []
    lieStrategy: 不撒谎，不替玩家推理，不主动公布答案。
    speechStyle: 简短、程序化，提醒大家围绕事实说话。
    openingStatement: >
      今天只问清楚一件事：戒指什么时候不见的，谁有机会碰到它。
      每个人按自己看到的说，不要抢话，也不要互相扣帽子。

  - id: li
    name: 李教授
    roleType: innocent
    portrait: null
    personality: 好面子、讲排场，遇到质疑时容易急躁。
    publicBackground: 梧桐镇小诊所医生，平时负责问诊和理疗。
    visibleFacts:
      - 理疗前把金戒指摘下，放在前台托盘里。
      - 赵晨追进诊所争执时，他离开理疗床附近去应付对方。
      - 争执结束后，他发现托盘还在，戒指不见了。
    privateFacts:
      - 他没有拿走自己的戒指，也没有把戒指转移到别处。
    lieStrategy: 不偷戒指，但会回避自己和小卢之间的辞职、工资矛盾。
    speechStyle: 爱强调自己是失主，说话带点不耐烦。
    openingStatement: >
      戒指是我自己摘下来放到前台托盘里的。赵晨一闹，我就被他缠住了。
      等我再看，托盘还好好在那儿，戒指没了。

  - id: lu
    name: 小卢
    roleType: culprit
    portrait: null
    personality: 表面机灵、嘴上客气，心里压着不满，遇到追问会装委屈。
    publicBackground: 诊所护士兼助理，负责前台接待、理疗准备和杂务。
    visibleFacts:
      - 案发前一直在前台附近。
      - 周奶奶进诊所时看见她正在嚼口香糖。
      - 她熟悉前台托盘、柜台和垃圾桶的位置。
      - 她最近提过想离开诊所，但交接还没谈妥。
    privateFacts:
      - 她趁赵晨追进来争执时，用嘴里的口香糖粘住戒指。
      - 她把包着戒指的口香糖按在前台柜台底下，打算等人散了再取走。
      - 她把口香糖包装纸丢进了诊所角落的垃圾桶。
    lieStrategy: >
      承认自己在前台，承认嚼过口香糖，但说自己只是吐掉了；
      把注意力引向有怨气又靠近过前台的赵晨。
    speechStyle: 语气轻、会喊冤，常说“我就在前台忙自己的”“谁会用这种办法偷东西”。
    openingStatement: >
      我一直在前台忙，赵晨闯进来以后大家都在看他。
      戒指放哪儿、什么时候没的，我真没注意。你们不能因为我离托盘近就怀疑我吧？

  - id: zhao
    name: 赵晨
    roleType: innocent
    portrait: null
    personality: 冲动、直来直去，有怨气但不擅长掩饰。
    publicBackground: 穿运动服的年轻人，曾因家人就诊问题和李教授发生过矛盾。
    visibleFacts:
      - 先在诊所门口和李教授争执。
      - 李教授转身回诊所后，他又追进去继续讨说法。
      - 他争执时经过前台附近，一度拍过或扶过柜台边缘。
      - 他离开时没有被发现带走戒指。
    privateFacts:
      - 他没有拿戒指，也不知道戒指被藏在柜台底下。
    lieStrategy: 不偷戒指，但因为自己闹事心虚，会避重就轻地淡化自己靠近前台的动作。
    speechStyle: 句子短、火气重，经常反问。
    openingStatement: >
      我是来找李教授说理的，不是来偷东西的。我是进去了，也碰过前台边上，
      但那是我跟他说话急了，戒指我根本没见着。

  - id: zhou-granny
    name: 周奶奶
    roleType: witness
    portrait: null
    personality: 心细但容易紧张，说话慢，会反复确认自己记得的细节。
    publicBackground: 梧桐镇老人患者，当天来诊所看膝盖。
    visibleFacts:
      - 进诊所时看见小卢在前台嚼口香糖。
      - 看见李教授把金戒指摘下来，放到前台托盘里。
      - 看见赵晨从门口追进来争执，并经过前台附近。
      - 争执时她的注意力主要被赵晨和李教授吸引。
    privateFacts:
      - 她没有看见谁直接拿走戒指。
    lieStrategy: 不撒谎，但记忆顺序需要被慢慢追问出来。
    speechStyle: 老实、慢吞吞，常用“我记得”“好像是这么个顺序”。
    openingStatement: >
      我是来做理疗的。李医生摘戒指、小卢嚼口香糖、那个小伙子追进来吵，
      这些我都看见了。可真要说谁拿了戒指，我没亲眼看见。

evidence:
  - id: li-report
    title: 李教授的报案陈述
    stage: initial
    provider: police
    content: >
      李教授称，他在给周奶奶做理疗前把金戒指摘下，放到前台托盘里；
      赵晨追进诊所争执后，他再回到前台，发现托盘还在，戒指不见了。

  - id: tray-condition
    title: 前台托盘状态
    stage: initial
    provider: police
    content: >
      前台托盘没有被拿走，也没有翻倒痕迹，托盘里只少了金戒指。
      这说明戒指是被人从托盘里单独取走或转移。

  - id: granny-initial-statement
    title: 周奶奶的初始证词
    stage: initial
    provider: police
    content: >
      周奶奶记得，小卢在她进诊所时正在前台嚼口香糖；
      李教授摘戒指后，赵晨从门口追进诊所争执，并经过前台附近。

  - id: gum-wrapper
    title: 垃圾桶里的口香糖包装纸
    stage: unlockable
    provider: ai2_or_police
    vagueLabel: 证据一
    discoveryLabel: 前台附近的细小垃圾
    triggerHint: >
      当玩家追问小卢案发前后有没有嚼口香糖、口香糖去了哪里，
      或要求检查前台附近垃圾桶时，可申请周警官核实。
    content: >
      诊所角落垃圾桶里只有一张新丢进去不久的口香糖包装纸，
      没有找到对应的口香糖本体。

  - id: gum-under-counter
    title: 柜台底下的口香糖
    stage: unlockable
    provider: ai2_or_police
    vagueLabel: 证据二
    discoveryLabel: 前台柜台底部的异常黏附物
    triggerHint: >
      当玩家追问戒指可能被临时藏在哪里、要求检查前台柜台底部，
      或发现口香糖本体不在垃圾桶里时，可申请周警官查看。
    content: >
      前台柜台底下粘着一团被按扁的口香糖，位置隐蔽，
      站在前台外侧不容易第一时间看到。

  - id: ring-in-gum
    title: 口香糖里的金戒指
    stage: unlockable
    provider: ai2_or_police
    vagueLabel: 证据三
    discoveryLabel: 被临时藏住的失物
    triggerHint: >
      当玩家已经发现柜台底下的口香糖，并要求进一步取下检查时，
      可申请周警官处理。
    content: >
      周警官戴手套取下柜台底下的口香糖后，发现李教授失踪的金戒指
      被包在口香糖里，粘在柜台底部。

phases:
  - id: briefing
    title: 报案
    purpose: 让玩家了解诊所内金戒指失踪的背景、当时在场人员和初始证据。
    visibleEvidence:
      - li-report
      - tray-condition
      - granny-initial-statement
    availableActions:
      - read_report
      - start_interrogation

  - id: interrogation
    title: 圆桌盘问
    purpose: 让玩家自由询问人物、引用追问、发现矛盾、触发关键证据。
    characters:
      - li
      - lu
      - zhao
      - zhou-granny
    evidenceBehavior:
      initialEvidenceVisible: true
      unlockableEvidenceByTriggerHint: true
    availableActions:
      - ask_character
      - quote_followup
      - request_evidence_check
      - open_case_file
      - request_summary
      - submit_verdict

  - id: verdict
    title: 审判
    purpose: 让玩家选择拿走戒指的人、判断是否有人包庇，并查看结案反馈。
    requiredDecision:
      culprit: single
      accomplices: multiple
      innocents: multiple

truth:
  timeline:
    - 周奶奶来到梧桐镇小诊所看膝盖，进门时看见小卢在前台嚼口香糖。
    - 李教授准备理疗，怕按摩油弄脏戒指，把金戒指摘下放在前台托盘里。
    - 赵晨先在诊所门口与李教授争执，李教授转身回到里面。
    - 赵晨不肯罢休，追进诊所继续争执，并经过前台附近。
    - 众人注意力被争执吸引时，小卢用嘴里的口香糖粘住戒指。
    - 小卢把包着戒指的口香糖按在前台柜台底下，准备等人散了再取走。
    - 小卢把口香糖包装纸丢进诊所角落的垃圾桶。
    - 争执结束后，李教授发现托盘还在，金戒指不见了，于是报案。
    - 周警官检查前台附近，最终从柜台底下的口香糖里找回金戒指。

  keyContradictions:
    - 赵晨有怨气且经过前台，但戒指没有被直接带走，而是被藏在前台柜台底下。
    - 小卢说自己只是在前台忙，但她案发前嚼的口香糖在案发后不见了。
    - 垃圾桶里有新的口香糖包装纸，却没有对应的口香糖本体。
    - 柜台底下发现的口香糖与失踪戒指直接连在一起。

solutionChain:
  - id: theft-window
    step: 1
    conclusion: 戒指是在李教授放入前台托盘后、赵晨争执结束前后这段混乱时间里失踪的。
    sourceRefs:
      - evidence.li-report
      - evidence.tray-condition
      - characters.zhou-granny.visibleFacts
    requiredForVerdict: true

  - id: ring-was-moved-from-tray
    step: 2
    conclusion: 前台托盘仍在且没有翻倒，说明戒指是被人单独从托盘中取走或转移。
    sourceRefs:
      - evidence.tray-condition
      - solutionChain.theft-window
    requiredForVerdict: true

  - id: both-had-opportunity
    step: 3
    conclusion: 小卢和赵晨都能接近前台附近，不能只凭接近机会判断是谁拿了戒指。
    sourceRefs:
      - evidence.granny-initial-statement
      - characters.lu.visibleFacts
      - characters.zhao.visibleFacts
    requiredForVerdict: true

  - id: zhao-is-strong-suspect
    step: 4
    conclusion: 赵晨有怨气，又在争执中经过前台附近，因此早期看起来像强嫌疑人。
    sourceRefs:
      - briefing.involvedParties
      - characters.zhao.visibleFacts
      - solutionChain.both-had-opportunity
    requiredForVerdict: false

  - id: hiding-method-not-direct-taking
    step: 5
    conclusion: 戒指后来不是被直接带离诊所，而是被临时藏在前台柜台底下。
    sourceRefs:
      - evidence.gum-under-counter
      - evidence.ring-in-gum
    requiredForVerdict: true

  - id: hiding-method-fits-insider
    step: 6
    conclusion: 柜台底下的位置隐蔽，更符合熟悉前台、能事后回来取东西的人使用。
    sourceRefs:
      - evidence.gum-under-counter
      - characters.lu.visibleFacts
      - solutionChain.hiding-method-not-direct-taking
    requiredForVerdict: true

  - id: gum-status-changed
    step: 7
    conclusion: 小卢案发前在嚼口香糖，而案发后口香糖本体没有出现在正常丢弃位置。
    sourceRefs:
      - evidence.granny-initial-statement
      - evidence.gum-wrapper
      - characters.lu.visibleFacts
    requiredForVerdict: true

  - id: gum-linked-to-ring
    step: 8
    conclusion: 柜台底下的口香糖和失踪金戒指直接连在一起，口香糖就是藏戒指的工具。
    sourceRefs:
      - evidence.gum-under-counter
      - evidence.ring-in-gum
      - solutionChain.gum-status-changed
    requiredForVerdict: true

  - id: zhao-does-not-fit-gum-chain
    step: 9
    conclusion: 赵晨虽然有动机和接近机会，但没有口香糖相关痕迹，也不符合把戒指藏在柜台底下等待取走的方式。
    sourceRefs:
      - characters.zhao.visibleFacts
      - solutionChain.hiding-method-fits-insider
      - solutionChain.gum-linked-to-ring
    requiredForVerdict: true

  - id: lu-linked-to-method
    step: 10
    conclusion: 小卢同时符合前台接近机会、熟悉柜台位置、案发前嚼口香糖和口香糖藏戒指这几条线索。
    sourceRefs:
      - characters.lu.visibleFacts
      - evidence.granny-initial-statement
      - evidence.gum-wrapper
      - evidence.gum-under-counter
      - evidence.ring-in-gum
      - solutionChain.hiding-method-fits-insider
    requiredForVerdict: true

  - id: final-verdict
    step: 11
    conclusion: 小卢趁赵晨追进诊所争执、众人注意力混乱时，用口香糖粘住金戒指并藏在柜台底下，准备之后取走；赵晨只是强误导嫌疑人，周奶奶是目击者。
    sourceRefs:
      - solutionChain.theft-window
      - solutionChain.ring-was-moved-from-tray
      - solutionChain.both-had-opportunity
      - solutionChain.hiding-method-not-direct-taking
      - solutionChain.gum-linked-to-ring
      - solutionChain.zhao-does-not-fit-gum-chain
      - solutionChain.lu-linked-to-method
    requiredForVerdict: true

verdict:
  culpritId: lu
  accompliceIds: []
  innocentIds:
    - li
    - zhao
    - zhou-granny
  explanation: >
    小卢利用赵晨追进诊所争执造成的混乱，用自己正在嚼的口香糖粘住李教授放在前台托盘里的金戒指，
    并把它藏在柜台底下，准备之后取走。李教授是失主；赵晨有怨气和接近机会，但没有口香糖证据链，也不符合这种临时藏匿方式；
    周奶奶只是目击者。
